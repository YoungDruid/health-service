spring.application.name=health
server.port=8000

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:users}
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD:apppassword}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false