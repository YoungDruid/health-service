
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'health-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8000']
  - job_name: 'ingress-nginx'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:10254']