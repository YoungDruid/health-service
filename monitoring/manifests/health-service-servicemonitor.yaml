apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: health-service
  namespace: monitoring
  labels:
    release: kps
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: health-service
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
