apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: health-service
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: arch.homework
      http:
        paths:
          - path: /otusapp/YoungDruid(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: health-service
                port:
                  number: 8000

          - path: /health
            pathType: Prefix
            backend:
              service:
                name: health-service
                port:
                  number: 8000