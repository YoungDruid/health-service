apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-service
spec:
  replicas: 2

  selector:
    matchLabels:
      app: health-service

  template:
    metadata:
      labels:
        app: health-service

    spec:
      containers:
        - name: health-service
          image: lifeharden/health-service:2.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: health-service-config
            - secretRef:
                name: health-service-secret
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5